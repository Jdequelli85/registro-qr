<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registro QR</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

.contenedor {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 10px 0 20px;
}

#reader {
    width: 100%;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

.resultado {
    margin-top: 20px;
    padding: 20px;
    background: #1f2937;
    border-radius: 15px;
}

.codigo {
    font-size: 36px;
    font-weight: bold;
    margin: 10px 0;
}

.estado {
    font-size: 18px;
}

.ok {
    color: #4ade80;
}

.error {
    color: #f87171;
}

</style>

</head>

<body>
      
<iframe
    name="iframeEnvio"
    style="display:none;">
</iframe>
      
<div class="contenedor">

<h1>📷 Registro QR</h1>

<div id="reader"></div>

<div class="resultado">

<div>Última lectura</div>

<div id="codigo" class="codigo">
—
</div>

<div id="estado" class="estado">
Esperando código...
</div>

</div>

</div>


<script>

// URL de nuestro Apps Script

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw__ILZ_j2wU3meAAP5edSrV9Q657mdublR3aBRLD-QLmUlzE0-8SkZV527fbqlu-lU/exec";


let procesando = false;


function codigoLeido(codigo) {

    if (procesando) {
        return;
    }

    procesando = true;

    document.getElementById("codigo").innerText = codigo;

    document.getElementById("estado").innerText =
        "Registrando...";


//

const url =
    APPS_SCRIPT_URL +
    "?codigo=" +
    encodeURIComponent(codigo);


// Crear formulario oculto
const formulario = document.createElement("form");

formulario.method = "GET";
formulario.action = url;
formulario.target = "iframeEnvio";
formulario.style.display = "none";

document.body.appendChild(formulario);


// Enviar a Apps Script
formulario.submit();


// Eliminar formulario después del envío
setTimeout(function() {
    formulario.remove();
}, 1000);


// Mostrar confirmación
document.getElementById("estado").innerText =
    "✓ Código enviado";

document.getElementById("estado").className =
    "estado ok";


// Preparar siguiente lectura
setTimeout(function() {

    procesando = false;

    document.getElementById("estado").innerText =
        "Listo para la siguiente lectura";

}, 1500);
      
}


// Crear lector QR

const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: {
            width: 250,
            height: 250
        }
    },
    false
);


// Iniciar lector

scanner.render(
    codigoLeido,
    function(error) {

        // Errores normales de búsqueda.
        // No mostramos nada.

    }
);

</script>

</body>

</html>
