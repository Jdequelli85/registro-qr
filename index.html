<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registro QR</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

.contenedor {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 10px 0 15px;
}

/* =========================================
   USUARIO
========================================= */

.usuario {
    font-size: 18px;
    margin-bottom: 8px;
}

.botonCambiar {
    border: none;
    background: #374151;
    color: white;
    padding: 8px 15px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 15px;
}

.botonCambiar:active {
    transform: scale(0.97);
}

/* =========================================
   CONTADOR
========================================= */

.contador {
    background: #1f2937;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 15px;
    font-size: 18px;
}

.contadorNumero {
    font-size: 28px;
    font-weight: bold;
}

/* =========================================
   LECTOR
========================================= */

#reader {
    width: 100%;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

/* =========================================
   RESULTADO
========================================= */

.resultado {
    margin-top: 20px;
    padding: 20px;
    background: #1f2937;
    border-radius: 15px;
}

.codigo {
    font-size: 36px;
    font-weight: bold;
    margin: 10px 0;
}

.estado {
    font-size: 18px;
}

.ok {
    color: #4ade80;
}

.error {
    color: #f87171;
}

/* =========================================
   PANTALLA DE SELECCIÓN DE USUARIO
========================================= */

#pantallaUsuario {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: #111827;

    z-index: 1000;

    display: flex;

    justify-content: center;
    align-items: center;
}

.usuarioBox {

    width: 90%;
    max-width: 400px;

    text-align: center;
}

.usuarioBox h2 {
    margin-bottom: 30px;
}

.botonUsuario {

    width: 100%;

    padding: 18px;

    margin: 10px 0;

    border: none;

    border-radius: 12px;

    background: #2563eb;

    color: white;

    font-size: 20px;

    font-weight: bold;
}

.botonUsuario:active {
    transform: scale(0.98);
}

/* =========================================
   PANTALLA REGISTRADO
========================================= */

#mensajeRegistro {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(17, 24, 39, 0.97);

    z-index: 2000;

    display: none;

    justify-content: center;
    align-items: center;
}

.registroBox {

    width: 90%;
    max-width: 450px;

    text-align: center;

    padding: 30px;
}

.iconoRegistro {
    font-size: 80px;
    margin-bottom: 10px;
}

.tituloRegistro {

    font-size: 42px;

    font-weight: bold;

    color: #4ade80;

    margin-bottom: 20px;
}

.codigoRegistro {

    font-size: 40px;

    font-weight: bold;

    margin-bottom: 15px;
}

.usuarioRegistro {

    font-size: 20px;

    margin-bottom: 25px;
}

.continuarRegistro {

    font-size: 17px;

    color: #d1d5db;
}

/* =========================================
   PANTALLA QR BLOQUEADO
========================================= */

#mensajeBloqueado {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(17, 24, 39, 0.97);

    z-index: 2000;

    display: none;

    justify-content: center;
    align-items: center;
}

.bloqueadoBox {

    width: 90%;
    max-width: 450px;

    text-align: center;

    padding: 30px;
}

.iconoBloqueado {

    font-size: 75px;

    margin-bottom: 10px;
}

.tituloBloqueado {

    font-size: 36px;

    font-weight: bold;

    color: #f87171;

    margin-bottom: 20px;
}

.codigoBloqueado {

    font-size: 36px;

    font-weight: bold;

    margin-bottom: 15px;
}

.tiempoBloqueado {

    font-size: 19px;

    color: #d1d5db;

    margin-bottom: 25px;
}

.continuarBloqueado {

    font-size: 17px;

    color: #9ca3af;
}

</style>

</head>

<body>


<!-- =========================================
     SELECCIÓN DE USUARIO
========================================= -->

<div id="pantallaUsuario">

    <div class="usuarioBox">

        <h2>
            ¿Quién está utilizando este teléfono?
        </h2>

        <button
            class="botonUsuario"
            onclick="seleccionarUsuario('Julio')">

            Julio

        </button>

        <button
            class="botonUsuario"
            onclick="seleccionarUsuario('Nicolás')">

            Nicolás

        </button>

    </div>

</div>


<!-- =========================================
     PANTALLA REGISTRADO
========================================= -->

<div id="mensajeRegistro">

    <div class="registroBox">

        <div class="iconoRegistro">
            ✓
        </div>

        <div class="tituloRegistro">
            REGISTRADO
        </div>

        <div
            id="codigoRegistro"
            class="codigoRegistro">
        </div>

        <div
            id="usuarioRegistro"
            class="usuarioRegistro">
        </div>

        <div class="continuarRegistro">
            Listo para el siguiente código...
        </div>

    </div>

</div>


<!-- =========================================
     PANTALLA CÓDIGO BLOQUEADO
========================================= -->

<div id="mensajeBloqueado">

    <div class="bloqueadoBox">

        <div class="iconoBloqueado">
            ⚠️
        </div>

        <div class="tituloBloqueado">
            YA REGISTRADO
        </div>

        <div
            id="codigoBloqueado"
            class="codigoBloqueado">
        </div>

        <div
            id="tiempoBloqueado"
            class="tiempoBloqueado">
        </div>

        <div class="continuarBloqueado">
            Puede continuar con otro código.
        </div>

    </div>

</div>


<!-- =========================================
     APLICACIÓN
========================================= -->

<div class="contenedor">

    <h1>
        📷 Registro QR
    </h1>


    <div class="usuario">

        Usuario:

        <strong id="usuarioActual">
            —
        </strong>

    </div>


    <!-- BOTÓN CAMBIAR USUARIO -->

    <button
        class="botonCambiar"
        onclick="cambiarUsuario()">

        👤 Cambiar usuario

    </button>


    <div class="contador">

        Registros de esta sesión

        <div
            id="contador"
            class="contadorNumero">

            0

        </div>

    </div>


    <div id="reader"></div>


    <div class="resultado">

        <div>
            Última lectura
        </div>

        <div
            id="codigo"
            class="codigo">

            —

        </div>

        <div
            id="estado"
            class="estado">

            Esperando código...

        </div>

    </div>

</div>


<script>


// ==========================================
// URL DE GOOGLE APPS SCRIPT
// ==========================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw__ILZ_j2wU3meAAP5edSrV9Q657mdublR3aBRLD-QLmUlzE0-8SkZV527fbqlu-lU/exec";


// ==========================================
// CONFIGURACIÓN
// ==========================================

const TIEMPO_BLOQUEO =
    5 * 60 * 1000;


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let procesando = false;

let cantidadRegistros = 0;


// ==========================================
// CARGAR USUARIO GUARDADO
// ==========================================

window.onload = function() {

    const usuarioGuardado =
        localStorage.getItem("usuarioQR");

    if (usuarioGuardado) {

        usuarioActual =
            usuarioGuardado;

        document.getElementById(
            "usuarioActual"
        ).innerText =
            usuarioActual;

        document.getElementById(
            "pantallaUsuario"
        ).style.display =
            "none";

    }

};


// ==========================================
// SELECCIONAR USUARIO
// ==========================================

function seleccionarUsuario(usuario) {

    usuarioActual =
        usuario;

    localStorage.setItem(
        "usuarioQR",
        usuario
    );

    document.getElementById(
        "usuarioActual"
    ).innerText =
        usuario;

    document.getElementById(
        "pantallaUsuario"
    ).style.display =
        "none";

}


// ==========================================
// CAMBIAR USUARIO
// ==========================================

function cambiarUsuario() {

    // Mostrar nuevamente la pantalla
    // de selección de usuario

    document.getElementById(
        "pantallaUsuario"
    ).style.display =
        "flex";

}


// ==========================================
// OBTENER BLOQUEOS
// ==========================================

function obtenerBloqueos() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "bloqueosQR"
            )
        ) || {};

    } catch (error) {

        return {};

    }

}


// ==========================================
// GUARDAR BLOQUEO
// ==========================================

function guardarBloqueo(codigo) {

    const bloqueos =
        obtenerBloqueos();

    bloqueos[codigo] =
        Date.now();

    localStorage.setItem(
        "bloqueosQR",
        JSON.stringify(bloqueos)
    );

}


// ==========================================
// VERIFICAR BLOQUEO
// ==========================================

function obtenerTiempoRestante(codigo) {

    const bloqueos =
        obtenerBloqueos();

    const momento =
        bloqueos[codigo];

    if (!momento) {

        return 0;

    }

    const transcurrido =
        Date.now() - momento;

    const restante =
        TIEMPO_BLOQUEO -
        transcurrido;

    if (restante <= 0) {

        delete bloqueos[codigo];

        localStorage.setItem(
            "bloqueosQR",
            JSON.stringify(bloqueos)
        );

        return 0;

    }

    return restante;

}


// ==========================================
// FORMATEAR TIEMPO
// ==========================================

function formatearTiempo(
    milisegundos
) {

    const segundos =
        Math.ceil(
            milisegundos / 1000
        );

    const minutos =
        Math.floor(
            segundos / 60
        );

    const segundosRestantes =
        segundos % 60;

    return
        minutos +
        " min " +
        segundosRestantes +
        " seg";

}


// ==========================================
// SONIDO
// ==========================================

function reproducirSonido() {

    try {

        const contexto =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const oscilador =
            contexto.createOscillator();

        const ganancia =
            contexto.createGain();

        oscilador.type =
            "sine";

        oscilador.frequency.value =
            880;

        ganancia.gain.value =
            0.15;

        oscilador.connect(
            ganancia
        );

        ganancia.connect(
            contexto.destination
        );

        oscilador.start();

        oscilador.stop(
            contexto.currentTime +
            0.15
        );

    } catch (error) {

        console.log(
            "No se pudo reproducir sonido"
        );

    }

}


// ==========================================
// VIBRACIÓN
// ==========================================

function vibrar() {

    if (
        "vibrate"
        in navigator
    ) {

        navigator.vibrate(
            [150]
        );

    }

}


// ==========================================
// MOSTRAR REGISTRADO
// ==========================================

function mostrarRegistrado(
    codigo
) {

    document.getElementById(
        "codigoRegistro"
    ).innerText =
        codigo;

    document.getElementById(
        "usuarioRegistro"
    ).innerText =
        "Usuario: " +
        usuarioActual;

    document.getElementById(
        "mensajeRegistro"
    ).style.display =
        "flex";

    reproducirSonido();

    vibrar();

    setTimeout(
        function() {

            document.getElementById(
                "mensajeRegistro"
            ).style.display =
                "none";

            procesando =
                false;

        },
        1500
    );

}


// ==========================================
// MOSTRAR BLOQUEADO
// ==========================================

function mostrarBloqueado(
    codigo,
    restante
) {

    document.getElementById(
        "codigoBloqueado"
    ).innerText =
        codigo;

    document.getElementById(
        "tiempoBloqueado"
    ).innerText =
        "Disponible nuevamente en " +
        formatearTiempo(
            restante
        );

    document.getElementById(
        "mensajeBloqueado"
    ).style.display =
        "flex";

    vibrar();

    setTimeout(
        function() {

            document.getElementById(
                "mensajeBloqueado"
            ).style.display =
                "none";

            procesando =
                false;

        },
        1800
    );

}


// ==========================================
// LEER QR
// ==========================================

function codigoLeido(codigo) {

    if (procesando) {

        return;

    }

    if (!usuarioActual) {

        alert(
            "Primero debe seleccionar un usuario"
        );

        return;

    }

    codigo =
        codigo.trim();

    if (!codigo) {

        return;

    }

    const tiempoRestante =
        obtenerTiempoRestante(
            codigo
        );

    if (
        tiempoRestante > 0
    ) {

        procesando =
            true;

        mostrarBloqueado(
            codigo,
            tiempoRestante
        );

        return;

    }

    procesando =
        true;

    document.getElementById(
        "codigo"
    ).innerText =
        codigo;

    document.getElementById(
        "estado"
    ).innerText =
        "Registrando...";

    document.getElementById(
        "estado"
    ).className =
        "estado";


    // ======================================
    // CREAR URL
    // ======================================

    const url =
        APPS_SCRIPT_URL +
        "?codigo=" +
        encodeURIComponent(
            codigo
        ) +
        "&usuario=" +
        encodeURIComponent(
            usuarioActual
        ) +
        "&t=" +
        Date.now();


    // ======================================
    // ENVIAR SIN CAMBIAR DE PÁGINA
    // ======================================

    const imagenEnvio =
        new Image();

    imagenEnvio.src =
        url;


    // ======================================
    // GUARDAR BLOQUEO
    // ======================================

    guardarBloqueo(
        codigo
    );


    // ======================================
    // CONTADOR
    // ======================================

    cantidadRegistros++;

    document.getElementById(
        "contador"
    ).innerText =
        cantidadRegistros;


    // ======================================
    // ESTADO
    // ======================================

    document.getElementById(
        "estado"
    ).innerText =
        "✓ Registrado";

    document.getElementById(
        "estado"
    ).className =
        "estado ok";


    // ======================================
    // CONFIRMACIÓN
    // ======================================

    mostrarRegistrado(
        codigo
    );

}


// ==========================================
// CREAR LECTOR QR
// ==========================================

const scanner =
    new Html5QrcodeScanner(

        "reader",

        {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            }

        },

        false

    );


// ==========================================
// INICIAR LECTOR
// ==========================================

scanner.render(

    codigoLeido,

    function(error) {

        // Los errores normales del lector
        // se ignoran.

    }

);

</script>

</body>

</html>
