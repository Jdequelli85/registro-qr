<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Registro QR</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

.contenedor {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

h1 {
    margin: 10px 0 20px;
}

#reader {
    width: 100%;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

.resultado {
    margin-top: 20px;
    padding: 20px;
    background: #1f2937;
    border-radius: 15px;
}

.codigo {
    font-size: 36px;
    font-weight: bold;
    margin: 10px 0;
}

.usuario {
    font-size: 18px;
    margin-bottom: 10px;
}

.estado {
    font-size: 18px;
}

.ok {
    color: #4ade80;
}

.error {
    color: #f87171;
}


/* -----------------------------------------
   Pantalla de selección de usuario
----------------------------------------- */

#pantallaUsuario {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: #111827;

    z-index: 1000;

    display: flex;

    justify-content: center;
    align-items: center;
}

.usuarioBox {

    width: 90%;
    max-width: 400px;

    text-align: center;
}

.usuarioBox h2 {

    margin-bottom: 30px;
}

.botonUsuario {

    width: 100%;

    padding: 18px;

    margin: 10px 0;

    border: none;

    border-radius: 12px;

    background: #2563eb;

    color: white;

    font-size: 20px;

    font-weight: bold;

}

.botonUsuario:active {

    transform: scale(0.98);

}

</style>

</head>


<body>


<!-- =========================================
     SELECCIÓN DE USUARIO
========================================= -->

<div id="pantallaUsuario">

    <div class="usuarioBox">

        <h2>
            ¿Quién está utilizando este teléfono?
        </h2>


        <button
            class="botonUsuario"
            onclick="seleccionarUsuario('Julio')">

            Julio

        </button>


        <button
            class="botonUsuario"
            onclick="seleccionarUsuario('Nicolás')">

            Nicolás

        </button>

    </div>

</div>



<!-- =========================================
     APLICACIÓN
========================================= -->

<div class="contenedor">

    <h1>📷 Registro QR</h1>


    <div class="usuario">

        Usuario:

        <strong id="usuarioActual">
            —
        </strong>

    </div>


    <div id="reader"></div>


    <div class="resultado">

        <div>
            Última lectura
        </div>


        <div
            id="codigo"
            class="codigo">

            —

        </div>


        <div
            id="estado"
            class="estado">

            Esperando código...

        </div>

    </div>

</div>



<!-- =========================================
     IFRAME OCULTO
========================================= -->

<iframe
    name="iframeEnvio"
    style="display:none;">
</iframe>



<script>


// ==========================================
// URL DE GOOGLE APPS SCRIPT
// ==========================================

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw__ILZ_j2wU3meAAP5edSrV9Q657mdublR3aBRLD-QLmUlzE0-8SkZV527fbqlu-lU/exec";


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let procesando = false;


// ==========================================
// CARGAR USUARIO GUARDADO
// ==========================================

window.onload = function() {

    const usuarioGuardado =
        localStorage.getItem("usuarioQR");


    if (usuarioGuardado) {

        usuarioActual =
            usuarioGuardado;


        document.getElementById(
            "usuarioActual"
        ).innerText =
            usuarioActual;


        document.getElementById(
            "pantallaUsuario"
        ).style.display =
            "none";

    }

};


// ==========================================
// SELECCIONAR USUARIO
// ==========================================

function seleccionarUsuario(usuario) {

    usuarioActual =
        usuario;


    localStorage.setItem(
        "usuarioQR",
        usuario
    );


    document.getElementById(
        "usuarioActual"
    ).innerText =
        usuario;


    document.getElementById(
        "pantallaUsuario"
    ).style.display =
        "none";

}


// ==========================================
// LEER QR
// ==========================================

//

      function codigoLeido(codigo) {

    if (procesando) {
        return;
    }

    if (!usuarioActual) {

        alert("Primero debe seleccionar un usuario");

        return;
    }

    procesando = true;


    // Mostrar código en pantalla

    document.getElementById("codigo")
        .innerText = codigo;

    document.getElementById("estado")
        .innerText = "Registrando...";

    document.getElementById("estado")
        .className = "estado";


    // ==========================================
    // CREAR URL CON CÓDIGO + USUARIO
    // ==========================================

    const url =
        APPS_SCRIPT_URL +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&usuario=" +
        encodeURIComponent(usuarioActual);


    // ==========================================
    // CREAR FORMULARIO OCULTO
    // ==========================================

    const formulario =
        document.createElement("form");

    formulario.method = "GET";

    formulario.action = url;

    formulario.target = "iframeEnvio";

    formulario.style.display = "none";


    document.body.appendChild(formulario);


    // ==========================================
    // ENVIAR A GOOGLE APPS SCRIPT
    // ==========================================

    formulario.submit();


    // Eliminar formulario después del envío

    setTimeout(function() {

        formulario.remove();

    }, 1000);


    // ==========================================
    // CONFIRMACIÓN VISUAL
    // ==========================================

    document.getElementById("estado")
        .innerText =
        "✓ Código enviado por " + usuarioActual;

    document.getElementById("estado")
        .className =
        "estado ok";


    // ==========================================
    // PERMITIR SIGUIENTE ESCANEO
    // ==========================================

    setTimeout(function() {

        procesando = false;

        document.getElementById("estado")
            .innerText =
            "Listo para la siguiente lectura";

        document.getElementById("estado")
            .className =
            "estado";

    }, 2000);

}


    // ======================================
    // PREPARAR SIGUIENTE LECTURA
    // ======================================

    setTimeout(function() {

        procesando = false;


        document.getElementById(
            "estado"
        ).innerText =
            "Listo para la siguiente lectura";


    }, 2000);

}


// ==========================================
// CREAR LECTOR QR
// ==========================================

const scanner =
    new Html5QrcodeScanner(

        "reader",

        {

            fps: 10,

            qrbox: {

                width: 250,

                height: 250

            }

        },

        false

    );


// ==========================================
// INICIAR LECTOR
// ==========================================

scanner.render(

    codigoLeido,

    function(error) {

        // Los errores normales de búsqueda
        // se ignoran.

    }

);

</script>


</body>

</html>
